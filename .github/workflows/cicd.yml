name: Advanced Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Static Code Quality
  quality:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: run next generate
        run: npx next typegen

      - name: Run ESLint
        run: npm run lint

  # JOB 2: Matrix Testing
  tests:
    name: Unit Tests - Node ${{ matrix.node-version }}
    permissions:
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        node-version: ["24", "26"]

    uses: $/.github/workflows/reusable-node-tests.yml

    with:
      node-version: ${{ matrix.node-version }}

  # JOB: Dependency Security Audit
  dependency-audit:
    name: npm Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate Lockfile and Install Dependencies
        run: npm ci --ignore-scripts

      - name: Scan Dependencies
        run: npm audit --audit-level=high

  # JOB 3: Production Build
  build:
    name: Production Build

    needs:
      - quality
      - tests
      - dependency-audit

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
