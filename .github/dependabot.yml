version: 2

updates:
  # NPM dependencies
  - package-ecosystem: npm
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 10

    labels:
      - dependencies
      - npm

    groups:
      # Group development dependency updates
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - github-actions

  # Docker dependencies (Dockerfile base images)
  - package-ecosystem: docker
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - docker
